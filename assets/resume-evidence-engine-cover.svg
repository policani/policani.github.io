<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Resume Evidence Engine: evidence passes through a human review gate before becoming a resume or DOCX.">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061429"/>
      <stop offset="1" stop-color="#0c2e63"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f8fe0"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <text x="44" y="60" fill="#a9c6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="1.5">RESUME EVIDENCE ENGINE</text>
  <text x="44" y="88" fill="#5d7fc4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Evidence-grounded drafting with human review gates</text>

  <!-- evidence stack -->
  <g>
    <rect x="60" y="180" rx="9" width="150" height="120" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.5"/>
    <line x1="80" y1="212" x2="190" y2="212" stroke="#5d7fc4" stroke-width="3"/>
    <line x1="80" y1="232" x2="190" y2="232" stroke="#5d7fc4" stroke-width="3"/>
    <line x1="80" y1="252" x2="168" y2="252" stroke="#5d7fc4" stroke-width="3"/>
    <line x1="80" y1="272" x2="190" y2="272" stroke="#5d7fc4" stroke-width="3"/>
    <text x="135" y="166" fill="#cfe0ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">Evidence</text>
  </g>
  <line x1="214" y1="240" x2="276" y2="240" stroke="#6f8fe0" stroke-width="2.2" marker-end="url(#arr2)"/>

  <!-- review gate -->
  <rect x="280" y="190" rx="13" width="190" height="100" fill="#243f86" stroke="#7b8cff" stroke-width="2.4"/>
  <circle cx="330" cy="240" r="22" fill="none" stroke="#8fe0b0" stroke-width="3.5"/>
  <path d="M320 240 l7 8 l13 -16" fill="none" stroke="#8fe0b0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="392" y="234" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" text-anchor="middle">human</text>
  <text x="392" y="254" fill="#bcd0ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">review gate</text>
  <line x1="474" y1="240" x2="536" y2="240" stroke="#6f8fe0" stroke-width="2.2" marker-end="url(#arr2)"/>

  <!-- output -->
  <rect x="540" y="180" rx="9" width="150" height="120" fill="#13386f" stroke="#7b8cff" stroke-width="1.8"/>
  <line x1="560" y1="212" x2="670" y2="212" stroke="#cfe0ff" stroke-width="3"/>
  <line x1="560" y1="232" x2="670" y2="232" stroke="#cfe0ff" stroke-width="3"/>
  <line x1="560" y1="252" x2="648" y2="252" stroke="#cfe0ff" stroke-width="3"/>
  <rect x="612" y="266" rx="4" width="62" height="22" fill="#7b8cff"/>
  <text x="643" y="282" fill="#08152e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">DOCX</text>
  <text x="615" y="166" fill="#cfe0ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">Resume</text>

  <text x="400" y="356" fill="#7f9fd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">no claim ships without evidence behind it</text>
</svg>
