<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Decision rights and sponsorship: clear ownership of each call with an escalation path to the sponsor.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#edf3f5"/>
    </linearGradient>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9922e"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#526272}
      .step{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#172234}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:750;fill:#6b7a88}
      .cell{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;font-weight:850;fill:#ffffff}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:750;fill:#344456}
      .esc{fill:none;stroke:#c9922e;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#fff" stroke="#d9e3e8"/>
  <text x="50" y="70" class="title">Decision Rights &amp; Sponsorship</text>
  <text x="50" y="98" class="sub">Who owns the call, and where it escalates</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#e4ebef"/>

  <!-- sponsor node -->
  <rect x="318" y="150" width="164" height="44" rx="9" fill="#fffaf0" stroke="#e3c98a" stroke-width="1.6"/>
  <text x="400" y="177" text-anchor="middle" class="step">Sponsor</text>

  <!-- ownership grid -->
  <g>
    <!-- column headers -->
    <text x="300" y="232" text-anchor="middle" class="small">Intake</text>
    <text x="400" y="232" text-anchor="middle" class="small">Sequence</text>
    <text x="500" y="232" text-anchor="middle" class="small">Release</text>
    <!-- row labels -->
    <text x="150" y="266" class="small">PMO</text>
    <text x="150" y="300" class="small">Delivery</text>
    <text x="150" y="334" class="small">Finance</text>
    <!-- grid cells (owner = teal R) -->
    <rect x="256" y="250" width="88" height="26" rx="6" fill="#2f7f95"/><text x="300" y="268" text-anchor="middle" class="cell">R</text>
    <rect x="356" y="250" width="88" height="26" rx="6" fill="#eef3f5" stroke="#d9e3e8"/>
    <rect x="456" y="250" width="88" height="26" rx="6" fill="#eef3f5" stroke="#d9e3e8"/>
    <rect x="256" y="284" width="88" height="26" rx="6" fill="#eef3f5" stroke="#d9e3e8"/>
    <rect x="356" y="284" width="88" height="26" rx="6" fill="#eef3f5" stroke="#d9e3e8"/>
    <rect x="456" y="284" width="88" height="26" rx="6" fill="#2f7f95"/><text x="500" y="302" text-anchor="middle" class="cell">R</text>
    <rect x="256" y="318" width="88" height="26" rx="6" fill="#eef3f5" stroke="#d9e3e8"/>
    <rect x="356" y="318" width="88" height="26" rx="6" fill="#2f7f95"/><text x="400" y="336" text-anchor="middle" class="cell">R</text>
    <rect x="456" y="318" width="88" height="26" rx="6" fill="#eef3f5" stroke="#d9e3e8"/>
  </g>

  <!-- escalation path -->
  <path d="M560 297 H612 V172 H486" class="esc" marker-end="url(#arrowg)"/>
  <text x="640" y="248" text-anchor="middle" class="small">Escalation</text>

  <rect x="86" y="362" width="628" height="38" rx="8" fill="#f6f9fa" stroke="#dce6eb"/>
  <text x="400" y="385" text-anchor="middle" class="footer">Clear ownership of each call, with a path to the sponsor.</text>
  <rect x="50" y="116" width="82" height="4" rx="2" fill="#2f7f95"/>
  <rect x="138" y="116" width="42" height="4" rx="2" fill="#c9922e"/>
</svg>
