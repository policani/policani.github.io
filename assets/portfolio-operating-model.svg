<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 432" role="img" aria-label="The operating layer end to end: noisy demand becomes governed, evidenced value through intake and signal, visible tradeoffs, authorization, delivery readiness, and value realization, with AI workflow governance and partner governance as cross-cutting bands, proof kept inspectable, and human judgment owning decisions.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061429"/><stop offset="1" stop-color="#0c2e63"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f8fe0"/>
    </marker>
  </defs>
  <rect width="1200" height="432" fill="url(#bg)"/>
  <text x="44" y="50" fill="#a9c6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="1.6">THE OPERATING LAYER, END TO END</text>
  <text x="44" y="78" fill="#6f8fc4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Noisy demand becomes governed, evidenced value — the same spine the cards below detail.</text>

  <rect x="40" y="100" width="1120" height="38" rx="10" fill="#13284f" stroke="#4a6cb0" stroke-width="1.3"/>
  <text x="600" y="124" fill="#bcd0ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">AI workflow governance — reliance class · human review gates · accountability</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="40" y="172" width="196" height="84" rx="12" fill="#1a356f" stroke="#6f8fe0" stroke-width="1.6"/>
    <circle cx="138" cy="172" r="16" fill="#6f8fe0" stroke="#0c2e63" stroke-width="3"/><text x="138" y="178" fill="#08152e" font-size="15" font-weight="800" text-anchor="middle">1</text>
    <text x="138" y="222" fill="#eaf2ff" font-size="15.5" font-weight="800" text-anchor="middle">Noisy demand</text>
    <text x="138" y="243" fill="#9bb8ea" font-size="11.5" font-weight="600" text-anchor="middle">intake · signal · readiness</text>
    <line x1="236" y1="214" x2="269" y2="214" stroke="#6f8fe0" stroke-width="2.2" marker-end="url(#arr)"/>

    <rect x="271" y="172" width="196" height="84" rx="12" fill="#1a356f" stroke="#6f8fe0" stroke-width="1.6"/>
    <circle cx="369" cy="172" r="16" fill="#6f8fe0" stroke="#0c2e63" stroke-width="3"/><text x="369" y="178" fill="#08152e" font-size="15" font-weight="800" text-anchor="middle">2</text>
    <text x="369" y="222" fill="#eaf2ff" font-size="15.5" font-weight="800" text-anchor="middle">Tradeoffs visible</text>
    <text x="369" y="243" fill="#9bb8ea" font-size="11.5" font-weight="600" text-anchor="middle">capacity · risk · value</text>
    <line x1="467" y1="214" x2="500" y2="214" stroke="#6f8fe0" stroke-width="2.2" marker-end="url(#arr)"/>

    <rect x="502" y="172" width="196" height="84" rx="12" fill="#1a356f" stroke="#6f8fe0" stroke-width="1.6"/>
    <circle cx="600" cy="172" r="16" fill="#6f8fe0" stroke="#0c2e63" stroke-width="3"/><text x="600" y="178" fill="#08152e" font-size="15" font-weight="800" text-anchor="middle">3</text>
    <text x="600" y="222" fill="#eaf2ff" font-size="15.5" font-weight="800" text-anchor="middle">Authorized</text>
    <text x="600" y="243" fill="#9bb8ea" font-size="11.5" font-weight="600" text-anchor="middle">business case · charter</text>
    <line x1="698" y1="214" x2="731" y2="214" stroke="#6f8fe0" stroke-width="2.2" marker-end="url(#arr)"/>

    <rect x="733" y="172" width="196" height="84" rx="12" fill="#1a356f" stroke="#6f8fe0" stroke-width="1.6"/>
    <circle cx="831" cy="172" r="16" fill="#6f8fe0" stroke="#0c2e63" stroke-width="3"/><text x="831" y="178" fill="#08152e" font-size="15" font-weight="800" text-anchor="middle">4</text>
    <text x="831" y="222" fill="#eaf2ff" font-size="15.5" font-weight="800" text-anchor="middle">Delivery readiness</text>
    <text x="831" y="243" fill="#9bb8ea" font-size="11.5" font-weight="600" text-anchor="middle">UAT · controls · signoff</text>
    <line x1="929" y1="214" x2="962" y2="214" stroke="#6f8fe0" stroke-width="2.2" marker-end="url(#arr)"/>

    <rect x="964" y="172" width="196" height="84" rx="12" fill="#13386f" stroke="#7b8cff" stroke-width="1.9"/>
    <circle cx="1062" cy="172" r="16" fill="#7b8cff" stroke="#0c2e63" stroke-width="3"/><text x="1062" y="178" fill="#08152e" font-size="15" font-weight="800" text-anchor="middle">5</text>
    <text x="1062" y="222" fill="#eaf2ff" font-size="15.5" font-weight="800" text-anchor="middle">Value realization</text>
    <text x="1062" y="243" fill="#bcd0ff" font-size="11.5" font-weight="600" text-anchor="middle">benefits · confidence</text>
  </g>

  <rect x="40" y="292" width="1120" height="38" rx="10" fill="#13284f" stroke="#4a6cb0" stroke-width="1.3"/>
  <text x="600" y="316" fill="#bcd0ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">Partner &amp; external delivery governance — qualification · controls · escalation</text>

  <text x="600" y="364" fill="#9bbcf0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Proof stays inspectable: source artifacts kept separate from public-safe examples</text>
  <text x="600" y="390" fill="#6f8fd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Human judgment owns decisions, approvals, risk acceptance, and funding</text>
</svg>
