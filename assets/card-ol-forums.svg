<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Governance forums: agendas of named asks become committed decisions at the review table.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#edf3f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7f95"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#526272}
      .step{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#172234}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:750;fill:#6b7a88}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:750;fill:#344456}
      .flow{fill:none;stroke:#2f7f95;stroke-width:2.2;stroke-linecap:round}
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#fff" stroke="#d9e3e8"/>
  <text x="50" y="70" class="title">Governance Forums</text>
  <text x="50" y="98" class="sub">Where agendas become decisions</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#e4ebef"/>

  <!-- agenda in -->
  <rect x="64" y="234" width="128" height="80" rx="10" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
  <text x="128" y="266" text-anchor="middle" class="step">Agenda</text>
  <text x="128" y="286" text-anchor="middle" class="small">named asks</text>
  <path d="M194 274 H252" class="flow" marker-end="url(#arrow)"/>

  <!-- council table with seats -->
  <ellipse cx="400" cy="274" rx="96" ry="54" fill="#eef6f7" stroke="#2f7f95" stroke-width="1.8"/>
  <text x="400" y="270" text-anchor="middle" class="step">Review</text>
  <text x="400" y="288" text-anchor="middle" class="small">forum</text>
  <circle cx="338" cy="232" r="9" fill="#2f7f95"/>
  <circle cx="400" cy="216" r="9" fill="#c9922e"/>
  <circle cx="462" cy="232" r="9" fill="#2f7f95"/>
  <circle cx="338" cy="316" r="9" fill="#2f7f95"/>
  <circle cx="400" cy="332" r="9" fill="#2f7f95"/>
  <circle cx="462" cy="316" r="9" fill="#c9922e"/>

  <!-- decision out -->
  <path d="M500 274 H560" class="flow" marker-end="url(#arrow)"/>
  <rect x="562" y="234" width="150" height="80" rx="10" fill="#f6f9fa" stroke="#cad7df" stroke-width="1.5"/>
  <text x="637" y="266" text-anchor="middle" class="step">Decisions</text>
  <text x="637" y="286" text-anchor="middle" class="small">committed &amp; owned</text>

  <rect x="86" y="362" width="628" height="38" rx="8" fill="#f6f9fa" stroke="#dce6eb"/>
  <text x="400" y="385" text-anchor="middle" class="footer">The room where tradeoffs become committed decisions.</text>
  <rect x="50" y="116" width="82" height="4" rx="2" fill="#2f7f95"/>
  <rect x="138" y="116" width="42" height="4" rx="2" fill="#c9922e"/>
</svg>
