<circle cx="620.0" cy="322" r="5" fill="#3b6f8f"/><line x1="620.0" y1="332" x2="620.0" y2="352" class="tick"/>
  <path d="M200.0 218 H210.0" class="flow" marker-end="url(#arrow)"/>
