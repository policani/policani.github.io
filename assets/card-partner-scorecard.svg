<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A partner qualification scorecard rating qualification, controls, and readiness with an accountable status per partner."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061429"/><stop offset="1" stop-color="#0c2e63"/></linearGradient></defs><rect width="800" height="450" fill="url(#bg)"/><text x="44" y="56" fill="#a9c6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="1.3">DISCIPLINE FOR EXTERNAL DELIVERY</text><text x="44" y="84" fill="#6f8fc4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="600">Qualify partners; govern controls and escalation.</text><g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7f9fce"><text x="64" y="142">Partner</text><text x="404" y="142" text-anchor="middle">Qualification</text><text x="556" y="142" text-anchor="middle">Controls</text><text x="700" y="142" text-anchor="middle">Status</text></g><line x1="44" y1="154" x2="756" y2="154" stroke="#2b4a82" stroke-width="1"/><rect x="44" y="168" width="712" height="54" rx="9" fill="#16356b" stroke="#7b8cff" stroke-width="1.6"/><rect x="44" y="168" width="5" height="54" rx="2.5" fill="#7b8cff"/><text x="64" y="200" fill="#f0f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="700">Delivery partner A</text><text x="404" y="200" fill="#b9cbec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Pass</text><text x="556" y="200" fill="#b9cbec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Strong</text><rect x="652" y="180" width="96" height="30" rx="15" fill="#16356b"/><text x="700" y="200" fill="#7b8cff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">Qualified</text><rect x="44" y="230" width="712" height="54" rx="9" fill="#0e2c57" stroke="#1d3a6a" stroke-width="1"/><text x="64" y="262" fill="#e3ecff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="700">Delivery partner B</text><text x="404" y="262" fill="#b9cbec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Pass</text><text x="556" y="262" fill="#e0a55a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Gaps</text><rect x="652" y="242" width="96" height="30" rx="15" fill="#33291a"/><text x="700" y="262" fill="#e0a55a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">Remediate</text><rect x="44" y="292" width="712" height="54" rx="9" fill="#0e2c57" stroke="#1d3a6a" stroke-width="1"/><text x="64" y="324" fill="#e3ecff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="700">Delivery partner C</text><text x="404" y="324" fill="#b9cbec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Hold</text><text x="556" y="324" fill="#b9cbec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle">—</text><rect x="652" y="304" width="96" height="30" rx="15" fill="#16294a"/><text x="700" y="324" fill="#7f9fce" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" text-anchor="middle">Not ready</text><text x="400" y="392" fill="#b9cbec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Qualification, controls, and readiness governed per partner — with defined escalation paths.</text><text x="400" y="430" fill="#5d7fc4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Artifact: partner qualification scorecard · partner ecosystem governance</text></svg>