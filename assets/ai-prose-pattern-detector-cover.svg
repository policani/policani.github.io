<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="AI Prose Pattern Detector: highlights generic AI-shaped phrasing in a block of text for revision.">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061429"/>
      <stop offset="1" stop-color="#0c2e63"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <text x="44" y="60" fill="#a9c6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="1.5">AI PROSE PATTERN DETECTOR</text>
  <text x="44" y="88" fill="#5d7fc4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Spot generic, AI-shaped phrasing before you publish</text>

  <!-- document panel -->
  <rect x="60" y="120" rx="12" width="680" height="270" fill="#0c2249" stroke="#3f63a8" stroke-width="1.5"/>

  <!-- text lines -->
  <g stroke-linecap="round">
    <line x1="92" y1="160" x2="520" y2="160" stroke="#5d7fc4" stroke-width="7"/>
    <line x1="92" y1="196" x2="300" y2="196" stroke="#5d7fc4" stroke-width="7"/>
    <!-- flagged phrase 1 -->
    <line x1="320" y1="196" x2="470" y2="196" stroke="#ffb56b" stroke-width="7"/>
    <line x1="490" y1="196" x2="690" y2="196" stroke="#5d7fc4" stroke-width="7"/>
    <line x1="92" y1="232" x2="690" y2="232" stroke="#5d7fc4" stroke-width="7"/>
    <line x1="92" y1="268" x2="240" y2="268" stroke="#5d7fc4" stroke-width="7"/>
    <!-- flagged phrase 2 -->
    <line x1="260" y1="268" x2="430" y2="268" stroke="#ffb56b" stroke-width="7"/>
    <line x1="450" y1="268" x2="600" y2="268" stroke="#5d7fc4" stroke-width="7"/>
    <line x1="92" y1="304" x2="540" y2="304" stroke="#5d7fc4" stroke-width="7"/>
  </g>

  <!-- flag callout -->
  <g>
    <line x1="470" y1="196" x2="600" y2="150" stroke="#ffb56b" stroke-width="1.6" stroke-dasharray="4 4"/>
    <rect x="600" y="128" rx="7" width="118" height="40" fill="#3a2a12" stroke="#ffb56b" stroke-width="1.6"/>
    <text x="659" y="153" fill="#ffd9a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="middle">flagged</text>
  </g>

  <text x="400" y="356" fill="#7f9fd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">generic phrasing, repetitive business language, revision opportunities</text>
</svg>
