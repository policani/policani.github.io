<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Subagent Operating Model: one router selects capabilities, applies a quality gate, and returns one result.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#eef4f6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b6f8f"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#526272}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#172234}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11.5px;font-weight:800;fill:#536476}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:750;fill:#344456}
      .flow{fill:none;stroke:#3b6f8f;stroke-width:2.3;stroke-linecap:round}
      .route{fill:none;stroke:#9fb4c0;stroke-width:1.8;stroke-dasharray:4 5}
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#fff" stroke="#d9e3e8"/>
  <text x="50" y="70" class="title">Subagent Operating Model</text>
  <text x="50" y="98" class="sub">Router-first capability selection</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#e4ebef"/>

  <rect x="70" y="210" width="116" height="58" rx="10" fill="#ffffff" stroke="#cad7df"/>
  <text x="128" y="244" text-anchor="middle" class="label">Request</text>
  <path d="M190 239 H286" class="flow" marker-end="url(#arrow)"/>

  <g>
    <circle cx="400" cy="239" r="70" fill="#f6f9fa" stroke="#3b6f8f" stroke-width="2"/>
    <circle cx="400" cy="239" r="35" fill="#3b6f8f"/>
    <text x="400" y="244" text-anchor="middle" class="label" fill="#fff">Router</text>
  </g>

  <g>
    <rect x="303" y="154" width="88" height="36" rx="8" fill="#fff" stroke="#cad7df"/>
    <text x="347" y="177" text-anchor="middle" class="small">Discover</text>
    <rect x="411" y="154" width="86" height="36" rx="8" fill="#fff" stroke="#cad7df"/>
    <text x="454" y="177" text-anchor="middle" class="small">Design</text>
    <rect x="292" y="288" width="76" height="36" rx="8" fill="#fff" stroke="#cad7df"/>
    <text x="330" y="311" text-anchor="middle" class="small">Build</text>
    <rect x="385" y="318" width="78" height="36" rx="8" fill="#fff8e8" stroke="#c9922e"/>
    <text x="424" y="341" text-anchor="middle" class="small">Verify</text>
    <rect x="480" y="288" width="94" height="36" rx="8" fill="#fff" stroke="#cad7df"/>
    <text x="527" y="311" text-anchor="middle" class="small">Operate</text>
  </g>

  <path d="M381 203 C366 190 356 185 347 190" class="route"/>
  <path d="M419 203 C433 190 442 185 454 190" class="route"/>
  <path d="M372 276 C352 284 342 290 330 288" class="route"/>
  <path d="M405 309 C410 315 416 318 424 318" class="route"/>
  <path d="M446 276 C475 282 500 286 527 288" class="route"/>

  <path d="M472 239 H540" class="flow" marker-end="url(#arrow)"/>
  <rect x="548" y="210" width="82" height="58" rx="10" fill="#fff8e8" stroke="#c9922e" stroke-width="1.6"/>
  <text x="589" y="244" text-anchor="middle" class="label">Gate</text>
  <path d="M634 239 H696" class="flow" marker-end="url(#arrow)"/>
  <rect x="700" y="210" width="30" height="58" rx="8" fill="#3b6f8f"/>
  <text x="715" y="244" text-anchor="middle" class="small" fill="#fff">1</text>

  <rect x="86" y="366" width="628" height="34" rx="8" fill="#f6f9fa" stroke="#dce6eb"/>
  <text x="400" y="388" text-anchor="middle" class="footer">Fewest capabilities, dependency order, one clean result.</text>
</svg>
