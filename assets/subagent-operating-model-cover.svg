<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Router-first subagent operating model: a request enters one router, which routes it to the fewest capabilities and returns one clean result.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061429"/>
      <stop offset="1" stop-color="#0c2e63"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f8fe0"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="44" y="60" fill="#a9c6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="1.5">SUBAGENT OPERATING MODEL</text>
  <text x="44" y="88" fill="#5d7fc4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Router-first · token-aware · one clean result</text>

  <!-- request -->
  <rect x="44" y="170" rx="11" width="150" height="56" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.5"/>
  <text x="119" y="204" fill="#e8f1ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">Any request</text>
  <line x1="198" y1="198" x2="252" y2="198" stroke="#6f8fe0" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- router -->
  <rect x="256" y="158" rx="13" width="180" height="80" fill="#243f86" stroke="#7b8cff" stroke-width="2.4"/>
  <text x="346" y="190" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="middle">router</text>
  <text x="346" y="214" fill="#bcd0ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">triage · route · quality-gate</text>
  <line x1="440" y1="198" x2="494" y2="198" stroke="#6f8fe0" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- capability chips -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="500" y="120" rx="8" width="120" height="34" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="560" y="142" fill="#cfe0ff">Decide</text>
    <rect x="636" y="120" rx="8" width="120" height="34" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="696" y="142" fill="#cfe0ff">Discover</text>
    <rect x="500" y="164" rx="8" width="120" height="34" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="560" y="186" fill="#cfe0ff">Build</text>
    <rect x="636" y="164" rx="8" width="120" height="34" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="696" y="186" fill="#cfe0ff">Verify</text>
    <rect x="500" y="208" rx="8" width="120" height="34" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="560" y="230" fill="#cfe0ff">Design</text>
    <rect x="636" y="208" rx="8" width="120" height="34" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="696" y="230" fill="#cfe0ff">Communicate</text>
    <rect x="568" y="252" rx="8" width="120" height="34" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="628" y="274" fill="#cfe0ff">Operate</text>
  </g>
  <text x="628" y="316" fill="#7f9fd8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">the fewest capabilities, in order</text>

  <!-- result -->
  <line x1="346" y1="238" x2="346" y2="362" stroke="#6f8fe0" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="232" y="364" rx="11" width="228" height="52" fill="#13386f" stroke="#7b8cff" stroke-width="1.8"/>
  <text x="346" y="396" fill="#eaf2ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" text-anchor="middle">One clean result · context kept</text>
</svg>
