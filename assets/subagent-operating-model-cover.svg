<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Router-first subagent operating model: any request enters one router that triages and routes it to the fewest of seven capability buckets — Decide, Discover, Design, Build, Verify, Communicate, Operate — and returns one clean result.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061429"/><stop offset="1" stop-color="#0c2e63"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f8fe0"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="44" y="56" fill="#a9c6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="1.4">SUBAGENT OPERATING MODEL</text>
  <text x="44" y="84" fill="#6f8fc4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="600">Router-first — one router triages every request, routes the fewest capabilities, returns one result.</text>

  <!-- request -->
  <rect x="44" y="227" width="160" height="56" rx="12" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.5"/>
  <text x="124" y="261" fill="#e8f1ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">Any request</text>
  <line x1="204" y1="255" x2="228" y2="255" stroke="#6f8fe0" stroke-width="2.4" marker-end="url(#arr)"/>

  <!-- router -->
  <rect x="232" y="213" width="186" height="84" rx="13" fill="#243f86" stroke="#7b8cff" stroke-width="2.2"/>
  <text x="325" y="250" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" text-anchor="middle">router</text>
  <text x="325" y="274" fill="#bcd0ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">triage · route · quality-gate</text>
  <line x1="418" y1="255" x2="462" y2="255" stroke="#6f8fe0" stroke-width="2.4" marker-end="url(#arr)"/>

  <!-- capability buckets: 2-col grid vertically centered on the router -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">
    <rect x="468" y="172" width="146" height="34" rx="8" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="541" y="194" fill="#cfe0ff">Decide</text>
    <rect x="620" y="172" width="150" height="34" rx="8" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="695" y="194" fill="#cfe0ff">Discover</text>
    <rect x="468" y="216" width="146" height="34" rx="8" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="541" y="238" fill="#cfe0ff">Design</text>
    <rect x="620" y="216" width="150" height="34" rx="8" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="695" y="238" fill="#cfe0ff">Build</text>
    <rect x="468" y="260" width="146" height="34" rx="8" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="541" y="282" fill="#cfe0ff">Verify</text>
    <rect x="620" y="260" width="150" height="34" rx="8" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="695" y="282" fill="#cfe0ff">Communicate</text>
    <rect x="544" y="304" width="150" height="34" rx="8" fill="#0e2c57" stroke="#3f63a8" stroke-width="1.3"/><text x="619" y="326" fill="#cfe0ff">Operate</text>
  </g>

  <!-- result -->
  <line x1="325" y1="297" x2="325" y2="370" stroke="#6f8fe0" stroke-width="2.4" marker-end="url(#arr)"/>
  <rect x="165" y="372" width="320" height="50" rx="13" fill="#13386f" stroke="#7b8cff" stroke-width="1.8"/>
  <text x="325" y="403" fill="#eaf2ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5" font-weight="800" text-anchor="middle">One clean result · context kept</text>
</svg>
