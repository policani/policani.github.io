<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Portfolio baseline: scattered demand resolved into one trustworthy, owned source of truth.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#edf3f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7f95"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#526272}
      .step{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#172234}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:750;fill:#6b7a88}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:750;fill:#344456}
      .flow{fill:none;stroke:#2f7f95;stroke-width:2.2;stroke-linecap:round}
      .chk{fill:none;stroke:#2f7f95;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#fff" stroke="#d9e3e8"/>
  <text x="50" y="70" class="title">Portfolio Baseline</text>
  <text x="50" y="98" class="sub">From scattered demand to one source of truth</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#e4ebef"/>

  <!-- scattered demand -->
  <g>
    <rect x="72" y="172" width="132" height="30" rx="7" fill="#f4f7f9" stroke="#b3c0c9" stroke-width="1.6"/>
    <circle cx="88" cy="187" r="4" fill="#b3c0c9"/><rect x="100" y="183" width="86" height="8" rx="4" fill="#dde5ea"/>
    <rect x="96" y="212" width="124" height="30" rx="7" fill="#f4f7f9" stroke="#b3c0c9" stroke-width="1.6"/>
    <circle cx="112" cy="227" r="4" fill="#b3c0c9"/><rect x="124" y="223" width="78" height="8" rx="4" fill="#dde5ea"/>
    <rect x="68" y="252" width="142" height="30" rx="7" fill="#f4f7f9" stroke="#b3c0c9" stroke-width="1.6"/>
    <circle cx="84" cy="267" r="4" fill="#b3c0c9"/><rect x="96" y="263" width="96" height="8" rx="4" fill="#dde5ea"/>
    <rect x="100" y="292" width="116" height="30" rx="7" fill="#f4f7f9" stroke="#b3c0c9" stroke-width="1.6"/>
    <circle cx="116" cy="307" r="4" fill="#b3c0c9"/><rect x="128" y="303" width="70" height="8" rx="4" fill="#dde5ea"/>
  </g>
  <text x="140" y="344" text-anchor="middle" class="small">Stalled and real, mixed</text>

  <path d="M232 247 H300" class="flow" marker-end="url(#arrow)"/>

  <!-- baseline ledger -->
  <rect x="318" y="166" width="404" height="158" rx="10" fill="#ffffff" stroke="#2f7f95" stroke-width="1.8"/>
  <text x="338" y="192" class="step">Portfolio baseline</text>
  <line x1="338" y1="204" x2="702" y2="204" stroke="#e4ebef"/>
  <g>
    <circle cx="346" cy="228" r="6" fill="#2f7f95"/><rect x="364" y="221" width="250" height="13" rx="6.5" fill="#eef3f5" stroke="#d9e3e8"/><circle cx="678" cy="228" r="9" fill="#fff" stroke="#2f7f95" stroke-width="1.6"/><path d="M673 228 l4 4 l6 -8" class="chk"/>
    <circle cx="346" cy="256" r="6" fill="#c9922e"/><rect x="364" y="249" width="250" height="13" rx="6.5" fill="#eef3f5" stroke="#d9e3e8"/><circle cx="678" cy="256" r="9" fill="#fff" stroke="#2f7f95" stroke-width="1.6"/><path d="M673 256 l4 4 l6 -8" class="chk"/>
    <circle cx="346" cy="284" r="6" fill="#2f7f95"/><rect x="364" y="277" width="250" height="13" rx="6.5" fill="#eef3f5" stroke="#d9e3e8"/><circle cx="678" cy="284" r="9" fill="#fff" stroke="#2f7f95" stroke-width="1.6"/><path d="M673 284 l4 4 l6 -8" class="chk"/>
  </g>

  <rect x="86" y="362" width="628" height="38" rx="8" fill="#f6f9fa" stroke="#dce6eb"/>
  <text x="400" y="385" text-anchor="middle" class="footer">One trustworthy view separates real work from stalled demand.</text>
  <rect x="50" y="116" width="82" height="4" rx="2" fill="#2f7f95"/>
  <rect x="138" y="116" width="42" height="4" rx="2" fill="#c9922e"/>
</svg>
