        <text x="153.5" y="232" text-anchor="middle" class="step">Idea</text>
      </g>
      <g>
        <rect x="219.5" y="174" width="116" height="88" rx="8" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
        <circle cx="243.5" cy="201" r="8" fill="#2f7f95"/>
        <path d="M239.5 201 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
