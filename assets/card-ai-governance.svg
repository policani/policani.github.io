<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="AI Activity Needs Governance: Workflow artifacts, review, and accountability.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#edf3f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7f95"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f172a;letter-spacing:.2px}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#526272}
      .step{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#172234}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:750;fill:#344456}
      .flow{fill:none;stroke:#2f7f95;stroke-width:2.2;stroke-linecap:round}
      .rail{fill:none;stroke:#d2dde3;stroke-width:2}
      .tick{stroke:#cad7df;stroke-width:1.5}
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#fff" stroke="#d9e3e8"/>
  <text x="50" y="70" class="title">AI Activity Needs Governance</text>
  <text x="50" y="98" class="sub">Workflow artifacts, review, and accountability</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#e4ebef"/>
  <path d="M92 322 H708" class="rail"/>
  <circle cx="180.0" cy="322" r="5" fill="#2f7f95"/><line x1="180.0" y1="332" x2="180.0" y2="352" class="tick"/>
<circle cx="290.0" cy="322" r="5" fill="#c9922e"/><line x1="290.0" y1="332" x2="290.0" y2="352" class="tick"/>
<circle cx="400.0" cy="322" r="5" fill="#2f7f95"/><line x1="400.0" y1="332" x2="400.0" y2="352" class="tick"/>
<circle cx="510.0" cy="322" r="5" fill="#c9922e"/><line x1="510.0" y1="332" x2="510.0" y2="352" class="tick"/>
<circle cx="620.0" cy="322" r="5" fill="#2f7f95"/><line x1="620.0" y1="332" x2="620.0" y2="352" class="tick"/>
  <path d="M207.5 218 H217.5" class="flow" marker-end="url(#arrow)"/>
