        <path d="M369.5 201 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="401.5" y="232" text-anchor="middle" class="step">Owner</text>
      </g>
      <g>
