<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Recover portfolio signal: noisy portfolio data resolved into a clean, ordered baseline.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#edf3f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7f95"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#526272}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:750;fill:#6b7a88}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:750;fill:#344456}
      .flow{fill:none;stroke:#2f7f95;stroke-width:2.2;stroke-linecap:round}
      .noisy{fill:none;stroke:#b3c0c9;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .clean{fill:none;stroke:#2f7f95;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .axis{stroke:#d2dde3;stroke-width:2}
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#fff" stroke="#d9e3e8"/>
  <text x="50" y="70" class="title">Recover Portfolio Signal</text>
  <text x="50" y="98" class="sub">From noisy data to a clean baseline</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#e4ebef"/>

  <line x1="78" y1="300" x2="330" y2="300" class="axis"/>
  <polyline class="noisy" points="86,250 112,288 138,196 164,300 190,210 216,286 242,232 268,296 294,214 320,270"/>
  <text x="204" y="326" text-anchor="middle" class="small">Distorted work-in-progress</text>

  <path d="M346 232 H392" class="flow" marker-end="url(#arrow)"/>

  <line x1="408" y1="300" x2="722" y2="300" class="axis"/>
  <polyline class="clean" points="420,284 470,262 520,238 570,214 620,190 670,170"/>
  <circle cx="470" cy="262" r="6" fill="#2f7f95"/>
  <circle cx="520" cy="238" r="6" fill="#c9922e"/>
  <circle cx="570" cy="214" r="6" fill="#2f7f95"/>
  <circle cx="620" cy="190" r="6" fill="#c9922e"/>
  <circle cx="670" cy="170" r="6" fill="#2f7f95"/>
  <text x="565" y="326" text-anchor="middle" class="small">Ordered, readiness-gated flow</text>

  <rect x="86" y="360" width="628" height="40" rx="8" fill="#f6f9fa" stroke="#dce6eb"/>
  <text x="400" y="385" text-anchor="middle" class="footer">Intake standards, lifecycle state, and priority logic restore the signal.</text>
  <rect x="50" y="116" width="82" height="4" rx="2" fill="#2f7f95"/>
  <rect x="138" y="116" width="42" height="4" rx="2" fill="#c9922e"/>
</svg>
