  <path d="M92 322 H708" class="rail"/>
  <circle cx="180.0" cy="322" r="5" fill="#2f7f95"/><line x1="180.0" y1="332" x2="180.0" y2="352" class="tick"/>
<circle cx="326.7" cy="322" r="5" fill="#c9922e"/><line x1="326.7" y1="332" x2="326.7" y2="352" class="tick"/>
<circle cx="473.3" cy="322" r="5" fill="#2f7f95"/><line x1="473.3" y1="332" x2="473.3" y2="352" class="tick"/>
<circle cx="620.0" cy="322" r="5" fill="#c9922e"/><line x1="620.0" y1="332" x2="620.0" y2="352" class="tick"/>
  <path d="M256.5 218 H278.5" class="flow" marker-end="url(#arrow)"/>
