<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A weighted portfolio scoring matrix: initiatives scored on value, risk, and effort, with a composite score, mandatory work flagged, and the top-ranked initiative highlighted — the artifact produced by the Portfolio Prioritization Scoring Agent.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061429"/><stop offset="1" stop-color="#0c2e63"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <text x="44" y="56" fill="#a9c6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="1.4">MAKING TRADEOFFS VISIBLE</text>
  <text x="44" y="83" fill="#6f8fc4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="600">Transparent weighted scoring — mandatory vs discretionary, auditable.</text>

  <!-- header -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7f9fce">
    <text x="64" y="132">Initiative</text>
    <text x="470" y="132" text-anchor="middle">Value</text>
    <text x="552" y="132" text-anchor="middle">Risk</text>
    <text x="634" y="132" text-anchor="middle">Effort</text>
    <text x="722" y="132" text-anchor="middle">Score</text>
  </g>
  <line x1="44" y1="144" x2="756" y2="144" stroke="#2b4a82" stroke-width="1"/>

  <!-- rows -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <!-- row 1 (top ranked, accent) -->
    <rect x="44" y="156" width="712" height="56" rx="9" fill="#16356b" stroke="#7b8cff" stroke-width="1.6"/>
    <rect x="44" y="156" width="5" height="56" rx="2.5" fill="#7b8cff"/>
    <text x="64" y="183" fill="#f0f6ff" font-size="15" font-weight="700">Compliance remediation</text>
    <rect x="64" y="190" width="74" height="18" rx="9" fill="#3a2f6e"/><text x="101" y="203" fill="#cdc4ff" font-size="10.5" font-weight="800" text-anchor="middle">MANDATORY</text>
    <text x="470" y="190" fill="#dfe9ff" font-size="15" font-weight="700" text-anchor="middle">9</text>
    <text x="552" y="190" fill="#dfe9ff" font-size="15" font-weight="700" text-anchor="middle">8</text>
    <text x="634" y="190" fill="#dfe9ff" font-size="15" font-weight="700" text-anchor="middle">5</text>
    <rect x="694" y="172" width="48" height="30" rx="15" fill="#7b8cff"/><text x="718" y="192" fill="#0b1330" font-size="15" font-weight="800" text-anchor="middle">87</text>

    <!-- row 2 -->
    <rect x="44" y="220" width="712" height="50" rx="9" fill="#0e2c57"/>
    <text x="64" y="251" fill="#e3ecff" font-size="15" font-weight="600">Revenue platform</text>
    <text x="470" y="251" fill="#b9cbec" font-size="15" font-weight="600" text-anchor="middle">8</text>
    <text x="552" y="251" fill="#b9cbec" font-size="15" font-weight="600" text-anchor="middle">6</text>
    <text x="634" y="251" fill="#b9cbec" font-size="15" font-weight="600" text-anchor="middle">7</text>
    <rect x="696" y="236" width="44" height="28" rx="14" fill="#234a86"/><text x="718" y="255" fill="#dfe9ff" font-size="14" font-weight="800" text-anchor="middle">74</text>

    <!-- row 3 -->
    <rect x="44" y="278" width="712" height="50" rx="9" fill="#0e2c57"/>
    <text x="64" y="309" fill="#e3ecff" font-size="15" font-weight="600">Data consolidation</text>
    <text x="470" y="309" fill="#b9cbec" font-size="15" font-weight="600" text-anchor="middle">6</text>
    <text x="552" y="309" fill="#b9cbec" font-size="15" font-weight="600" text-anchor="middle">5</text>
    <text x="634" y="309" fill="#b9cbec" font-size="15" font-weight="600" text-anchor="middle">6</text>
    <rect x="696" y="294" width="44" height="28" rx="14" fill="#234a86"/><text x="718" y="313" fill="#dfe9ff" font-size="14" font-weight="800" text-anchor="middle">61</text>

    <!-- row 4 -->
    <rect x="44" y="336" width="712" height="50" rx="9" fill="#0e2c57"/>
    <text x="64" y="367" fill="#e3ecff" font-size="15" font-weight="600">Tooling upgrade</text>
    <text x="470" y="367" fill="#b9cbec" font-size="15" font-weight="600" text-anchor="middle">4</text>
    <text x="552" y="367" fill="#b9cbec" font-size="15" font-weight="600" text-anchor="middle">3</text>
    <text x="634" y="367" fill="#b9cbec" font-size="15" font-weight="600" text-anchor="middle">8</text>
    <rect x="696" y="352" width="44" height="28" rx="14" fill="#1d3a6a"/><text x="718" y="371" fill="#9fbbe6" font-size="14" font-weight="800" text-anchor="middle">48</text>
  </g>

  <text x="44" y="424" fill="#5d7fc4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600">Artifact: weighted scoring matrix · Portfolio Prioritization Scoring Agent</text>
</svg>
