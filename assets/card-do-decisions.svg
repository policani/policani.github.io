<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Clarify how decisions move: options reach a forum and a decision record, with an escalation path to the sponsor.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#edf3f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7f95"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9922e"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#526272}
      .step{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#172234}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:750;fill:#6b7a88}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:750;fill:#344456}
      .flow{fill:none;stroke:#2f7f95;stroke-width:2.2;stroke-linecap:round}
      .esc{fill:none;stroke:#c9922e;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#fff" stroke="#d9e3e8"/>
  <text x="50" y="70" class="title">Clarify How Decisions Move</text>
  <text x="50" y="98" class="sub">Options to decision, with an escalation path</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#e4ebef"/>

  <!-- escalation node -->
  <rect x="318" y="160" width="164" height="48" rx="9" fill="#fffaf0" stroke="#e3c98a" stroke-width="1.6"/>
  <text x="400" y="189" text-anchor="middle" class="step">Sponsor escalation</text>

  <!-- main flow -->
  <g>
    <rect x="70" y="252" width="150" height="86" rx="10" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
    <text x="145" y="288" text-anchor="middle" class="step">Options</text>
    <text x="145" y="308" text-anchor="middle" class="small">value · risk · cost</text>
  </g>
  <path d="M222 295 H316" class="flow" marker-end="url(#arrow)"/>
  <g>
    <rect x="320" y="252" width="160" height="86" rx="10" fill="#ffffff" stroke="#2f7f95" stroke-width="1.8"/>
    <text x="400" y="288" text-anchor="middle" class="step">Decision forum</text>
    <text x="400" y="308" text-anchor="middle" class="small">framed tradeoffs</text>
  </g>
  <path d="M482 295 H576" class="flow" marker-end="url(#arrow)"/>
  <g>
    <rect x="580" y="252" width="150" height="86" rx="10" fill="#f6f9fa" stroke="#cad7df" stroke-width="1.5"/>
    <text x="655" y="288" text-anchor="middle" class="step">Decision record</text>
    <text x="655" y="308" text-anchor="middle" class="small">owner · rationale</text>
  </g>

  <path d="M400 252 V210" class="esc" marker-end="url(#arrowg)"/>

  <rect x="86" y="362" width="628" height="38" rx="8" fill="#f6f9fa" stroke="#dce6eb"/>
  <text x="400" y="385" text-anchor="middle" class="footer">Handoffs, forums, and decision records keep the thread intact.</text>
  <rect x="50" y="116" width="82" height="4" rx="2" fill="#2f7f95"/>
  <rect x="138" y="116" width="42" height="4" rx="2" fill="#c9922e"/>
</svg>
