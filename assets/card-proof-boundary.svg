<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Proof Needs To Stay Inspectable: Source boundary and public-safe evidence.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#edf3f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7f95"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f172a;letter-spacing:.2px}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#526272}
      .step{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#172234}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:750;fill:#344456}
      .flow{fill:none;stroke:#2f7f95;stroke-width:2.2;stroke-linecap:round}
      .rail{fill:none;stroke:#d2dde3;stroke-width:2}
      .tick{stroke:#cad7df;stroke-width:1.5}
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#fff" stroke="#d9e3e8"/>
  <text x="50" y="70" class="title">Proof Needs To Stay Inspectable</text>
  <text x="50" y="98" class="sub">Source boundary and public-safe evidence</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#e4ebef"/>
  <path d="M92 322 H708" class="rail"/>
  <circle cx="180.0" cy="322" r="5" fill="#2f7f95"/><line x1="180.0" y1="332" x2="180.0" y2="352" class="tick"/>
<circle cx="326.7" cy="322" r="5" fill="#c9922e"/><line x1="326.7" y1="332" x2="326.7" y2="352" class="tick"/>
<circle cx="473.3" cy="322" r="5" fill="#2f7f95"/><line x1="473.3" y1="332" x2="473.3" y2="352" class="tick"/>
<circle cx="620.0" cy="322" r="5" fill="#c9922e"/><line x1="620.0" y1="332" x2="620.0" y2="352" class="tick"/>
  <path d="M248.0 218 H270.0" class="flow" marker-end="url(#arrow)"/>
  <path d="M390.0 218 H412.0" class="flow" marker-end="url(#arrow)"/>
  <path d="M532.0 218 H554.0" class="flow" marker-end="url(#arrow)"/>
      <g>
        <rect x="140.0" y="174" width="106" height="88" rx="8" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
        <circle cx="164.0" cy="201" r="8" fill="#2f7f95"/>
        <path d="M160.0 201 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="193.0" y="232" text-anchor="middle" class="step">Source</text>
      </g>
      <g>
        <rect x="272.0" y="174" width="116" height="88" rx="8" fill="#fff8e8" stroke="#c9922e" stroke-width="1.5"/>
        <circle cx="296.0" cy="201" r="8" fill="#c9922e"/>
        <path d="M292.0 201 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="330.0" y="232" text-anchor="middle" class="step">Boundary</text>
      </g>
      <g>
        <rect x="414.0" y="174" width="116" height="88" rx="8" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
        <circle cx="438.0" cy="201" r="8" fill="#2f7f95"/>
        <path d="M434.0 201 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="472.0" y="232" text-anchor="middle" class="step">Sanitize</text>
      </g>
      <g>
        <rect x="556.0" y="174" width="104" height="88" rx="8" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
        <circle cx="580.0" cy="201" r="8" fill="#2f7f95"/>
        <path d="M576.0 201 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="608.0" y="232" text-anchor="middle" class="step">Proof</text>
      </g>
  <rect x="86" y="360" width="628" height="40" rx="8" fill="#f6f9fa" stroke="#dce6eb"/>
  <text x="400" y="385" text-anchor="middle" class="footer">Confidential inputs stay separate from public review artifacts.</text>
  <rect x="50" y="116" width="82" height="4" rx="2" fill="#2f7f95"/>
  <rect x="138" y="116" width="42" height="4" rx="2" fill="#c9922e"/>
</svg>



