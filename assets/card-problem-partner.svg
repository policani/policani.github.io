<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="External and partner delivery runs without governance: partner network passes a qualification and controls gate into accountable delivery, with an escalation path.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#edf3f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7f95"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9922e"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#526272}
      .step{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#172234}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:750;fill:#6b7a88}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:750;fill:#344456}
      .flow{fill:none;stroke:#2f7f95;stroke-width:2.2;stroke-linecap:round}
      .link{fill:none;stroke:#bcc8d0;stroke-width:1.8}
      .esc{fill:none;stroke:#c9922e;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#fff" stroke="#d9e3e8"/>
  <text x="50" y="70" class="title">Partner Delivery Needs Governance</text>
  <text x="50" y="98" class="sub">Qualification, controls, and escalation at scale</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#e4ebef"/>

  <!-- partner network -->
  <circle cx="150" cy="170" r="9" fill="#ffffff" stroke="#9fb4bd" stroke-width="2"/>
  <circle cx="92" cy="214" r="9" fill="#ffffff" stroke="#9fb4bd" stroke-width="2"/>
  <circle cx="150" cy="262" r="9" fill="#ffffff" stroke="#9fb4bd" stroke-width="2"/>
  <circle cx="118" cy="300" r="8" fill="#ffffff" stroke="#9fb4bd" stroke-width="2"/>
  <circle cx="182" cy="216" r="13" fill="#eaf3f5" stroke="#2f7f95" stroke-width="2"/>
  <path class="link" d="M159 173 L176 208 M101 214 L169 216 M159 259 L176 224 M126 296 L176 224"/>
  <text x="138" y="330" text-anchor="middle" class="small">Partner network</text>

  <path d="M210 216 H260" class="flow" marker-end="url(#arrow)"/>

  <!-- qualification + controls -->
  <rect x="266" y="170" width="190" height="118" rx="10" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
  <text x="286" y="196" class="step">Qualify &amp; control</text>
  <g>
    <circle cx="294" cy="220" r="6" fill="#2f7f95"/><path d="M290.5 220 l2.5 2.5 l5 -6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="310" y="224" class="small">Qualification standard</text>
  </g>
  <g>
    <circle cx="294" cy="244" r="6" fill="#2f7f95"/><path d="M290.5 244 l2.5 2.5 l5 -6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="310" y="248" class="small">Reimbursement controls</text>
  </g>
  <g>
    <circle cx="294" cy="268" r="6" fill="#c9922e"/><path d="M290.5 268 l2.5 2.5 l5 -6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="310" y="272" class="small">Readiness evidence</text>
  </g>

  <path d="M462 216 H512" class="flow" marker-end="url(#arrow)"/>

  <rect x="518" y="186" width="206" height="86" rx="10" fill="#f6f9fa" stroke="#cad7df" stroke-width="1.5"/>
  <text x="621" y="222" text-anchor="middle" class="step">Accountable delivery</text>
  <text x="621" y="242" text-anchor="middle" class="small">cadence &amp; follow-through</text>

  <path d="M361 170 V132 H621 V182" class="esc" marker-end="url(#arrowg)"/>
  <text x="491" y="124" text-anchor="middle" class="small" fill="#8a6526">escalation path</text>

  <rect x="86" y="364" width="628" height="36" rx="8" fill="#f6f9fa" stroke="#dce6eb"/>
  <text x="400" y="387" text-anchor="middle" class="footer">External and partner work stays accountable as it scales.</text>
  <rect x="50" y="116" width="82" height="4" rx="2" fill="#2f7f95"/>
  <rect x="138" y="116" width="42" height="4" rx="2" fill="#c9922e"/>
</svg>
