<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Demand lacks a governed path: scattered requests pass through an intake gate into a governed pipeline.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#edf3f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7f95"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#526272}
      .step{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#172234}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:750;fill:#6b7a88}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:750;fill:#344456}
      .flow{fill:none;stroke:#2f7f95;stroke-width:2.2;stroke-linecap:round}
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#fff" stroke="#d9e3e8"/>
  <text x="50" y="70" class="title">Demand Lacks a Path</text>
  <text x="50" y="98" class="sub">Ungoverned requests need a governed route</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#e4ebef"/>

  <rect x="66" y="166" width="176" height="118" rx="10" fill="#fbfdfe" stroke="#c4ced6" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="104" cy="200" r="7" fill="#2f7f95"/><circle cx="152" cy="222" r="7" fill="#c9922e"/>
  <circle cx="118" cy="252" r="7" fill="#2f7f95"/><circle cx="194" cy="202" r="7" fill="#2f7f95"/>
  <circle cx="210" cy="246" r="7" fill="#c9922e"/><circle cx="166" cy="262" r="6" fill="#2f7f95"/>
  <circle cx="96" cy="232" r="6" fill="#c9922e"/>
  <text x="154" y="306" text-anchor="middle" class="small">Unsorted demand</text>

  <path d="M250 225 H286" class="flow" marker-end="url(#arrow)"/>

  <rect x="290" y="185" width="124" height="80" rx="9" fill="#ffffff" stroke="#2f7f95" stroke-width="1.8"/>
  <text x="352" y="222" text-anchor="middle" class="step">Intake gate</text>
  <text x="352" y="242" text-anchor="middle" class="small">owner · readiness</text>

  <path d="M422 225 H458" class="flow" marker-end="url(#arrow)"/>

  <rect x="462" y="166" width="262" height="118" rx="10" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
  <g>
    <rect x="482" y="184" width="222" height="26" rx="6" fill="#f6f9fa" stroke="#dce6eb"/>
    <circle cx="500" cy="197" r="6" fill="#2f7f95"/><path d="M496.5 197 l2.5 2.5 l5 -6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="516" y="193" width="150" height="7" rx="3.5" fill="#d7e0e6"/>
  </g>
  <g>
    <rect x="482" y="216" width="222" height="26" rx="6" fill="#f6f9fa" stroke="#dce6eb"/>
    <circle cx="500" cy="229" r="6" fill="#2f7f95"/><path d="M496.5 229 l2.5 2.5 l5 -6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="516" y="225" width="120" height="7" rx="3.5" fill="#d7e0e6"/>
  </g>
  <g>
    <rect x="482" y="248" width="222" height="26" rx="6" fill="#f6f9fa" stroke="#dce6eb"/>
    <circle cx="500" cy="261" r="6" fill="#c9922e"/><path d="M496.5 261 l2.5 2.5 l5 -6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="516" y="257" width="160" height="7" rx="3.5" fill="#d7e0e6"/>
  </g>
  <text x="593" y="306" text-anchor="middle" class="small">Governed pipeline</text>

  <rect x="86" y="360" width="628" height="40" rx="8" fill="#f6f9fa" stroke="#dce6eb"/>
  <text x="400" y="385" text-anchor="middle" class="footer">Requests become owned, sequenced, decision-ready work.</text>
  <rect x="50" y="116" width="82" height="4" rx="2" fill="#2f7f95"/>
  <rect x="138" y="116" width="42" height="4" rx="2" fill="#c9922e"/>
</svg>
