<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" role="img" aria-label="Subagents work better with boundaries: one request, one router, focused capabilities, one useful result.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset="0.55" stop-color="#eef5f7"/>
      <stop offset="1" stop-color="#e7f0f2"/>
    </linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6f8f"/>
      <stop offset="1" stop-color="#1f4f6a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6f8f"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}
      .eyebrow{font-size:24px;font-weight:800;fill:#55717f}
      .title{font-size:58px;font-weight:900;fill:#102033}
      .subtitle{font-size:30px;font-weight:700;fill:#334b5b}
      .label{font-size:24px;font-weight:850;fill:#122236}
      .small{font-size:18px;font-weight:750;fill:#516575}
      .footer{font-size:20px;font-weight:800;fill:#2f4658}
      .node{fill:#fff;stroke:#cedde4;stroke-width:2}
      .accent{fill:#fff9eb;stroke:#d49a33;stroke-width:2}
      .flow{fill:none;stroke:#2f6f8f;stroke-width:4;stroke-linecap:round}
      .soft{fill:none;stroke:#bfd1d9;stroke-width:3;stroke-dasharray:8 10;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect x="42" y="42" width="1116" height="543" rx="22" fill="#ffffff" stroke="#d7e4e9"/>

  <text x="82" y="112" class="eyebrow">AI WORKFLOW DESIGN</text>
  <text x="82" y="188" class="title">Subagents work better</text>
  <text x="82" y="254" class="title">with clear boundaries.</text>
  <text x="84" y="321" class="subtitle">Give each AI collaborator a job, a handoff,</text>
  <text x="84" y="360" class="subtitle">and a quality gate before it touches the work.</text>

  <g transform="translate(84 410)">
    <rect class="node" x="0" y="0" width="165" height="78" rx="16"/>
    <text x="82.5" y="47" text-anchor="middle" class="label">Request</text>
    <path class="flow" d="M176 39 H258" marker-end="url(#arrow)"/>

    <circle cx="356" cy="39" r="72" fill="#f3f8fa" stroke="#2f6f8f" stroke-width="3"/>
    <circle cx="356" cy="39" r="40" fill="url(#router)"/>
    <text x="356" y="47" text-anchor="middle" class="label" fill="#ffffff">Router</text>

    <path class="soft" d="M332 -25 C272 -65 215 -44 182 -7"/>
    <path class="soft" d="M379 -24 C440 -63 500 -43 530 -5"/>
    <path class="soft" d="M333 102 C270 145 208 125 179 82"/>
    <path class="soft" d="M380 102 C440 146 507 124 536 83"/>

    <rect class="node" x="530" y="-49" width="138" height="54" rx="13"/>
    <text x="599" y="-15" text-anchor="middle" class="small">Strategy</text>
    <rect class="node" x="536" y="24" width="122" height="54" rx="13"/>
    <text x="597" y="58" text-anchor="middle" class="small">Copy</text>
    <rect class="node" x="522" y="96" width="158" height="54" rx="13"/>
    <text x="601" y="130" text-anchor="middle" class="small">Build / QA</text>

    <path class="flow" d="M432 39 H718" marker-end="url(#arrow)"/>
    <rect class="accent" x="728" y="0" width="140" height="78" rx="16"/>
    <text x="798" y="47" text-anchor="middle" class="label">Gate</text>
    <path class="flow" d="M880 39 H962" marker-end="url(#arrow)"/>
    <rect class="node" x="960" y="0" width="132" height="78" rx="16"/>
    <text x="1026" y="47" text-anchor="middle" class="label">Result</text>
  </g>

  <rect x="776" y="86" width="318" height="150" rx="18" fill="#f7fafb" stroke="#d8e5ea"/>
  <text x="806" y="132" class="label">Design rule</text>
  <text x="806" y="172" class="small">Fewest useful roles.</text>
  <text x="806" y="203" class="small">Clear ownership.</text>
  <text x="806" y="226" class="small">No duplicate work.</text>

  <text x="82" y="554" class="footer">policani.net/resources.html#ai-tools</text>
</svg>
