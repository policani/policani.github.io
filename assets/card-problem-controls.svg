<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Financial risk and leakage surface late: revenue flow loses drops to leakage until controls and thresholds catch them and protect the line.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#edf3f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7f95"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#526272}
      .step{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#172234}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:750;fill:#6b7a88}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:750;fill:#344456}
      .flow{fill:none;stroke:#2f7f95;stroke-width:2.2;stroke-linecap:round}
      .pipe{fill:#eaf3f5;stroke:#9fc2cc;stroke-width:1.5}
      .leak{fill:none;stroke:#c9922e;stroke-width:2;stroke-linecap:round;stroke-dasharray:3 5}
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#fff" stroke="#d9e3e8"/>
  <text x="50" y="70" class="title">Financial Risk Surfaces Late</text>
  <text x="50" y="98" class="sub">Detect leakage before it accumulates</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#e4ebef"/>

  <!-- revenue pipe -->
  <rect x="66" y="186" width="220" height="34" rx="8" class="pipe"/>
  <text x="176" y="208" text-anchor="middle" class="small" font-weight="800" fill="#225c6c">Revenue flow</text>

  <!-- leak drips -->
  <path d="M110 224 V256" class="leak"/><circle cx="110" cy="262" r="5" fill="#c9922e"/>
  <path d="M150 224 V268" class="leak"/><circle cx="150" cy="274" r="4" fill="#d8a94e"/>
  <path d="M198 224 V250" class="leak"/><circle cx="198" cy="256" r="5" fill="#c9922e"/>
  <path d="M240 224 V272" class="leak"/><circle cx="240" cy="278" r="4" fill="#d8a94e"/>
  <text x="176" y="306" text-anchor="middle" class="small" fill="#8a6526">leakage, fraud, exposure</text>

  <path d="M298 203 H342" class="flow" marker-end="url(#arrow)"/>

  <!-- controls / thresholds -->
  <rect x="350" y="166" width="180" height="118" rx="10" fill="#ffffff" stroke="#2f7f95" stroke-width="1.8"/>
  <text x="370" y="192" class="step">Controls &amp; thresholds</text>
  <g>
    <circle cx="378" cy="218" r="6" fill="#2f7f95"/><path d="M374.5 218 l2.5 2.5 l5 -6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="394" y="222" class="small">Detection thresholds</text>
  </g>
  <g>
    <circle cx="378" cy="242" r="6" fill="#2f7f95"/><path d="M374.5 242 l2.5 2.5 l5 -6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="394" y="246" class="small">Audit-ready review</text>
  </g>
  <g>
    <circle cx="378" cy="266" r="6" fill="#c9922e"/><path d="M374.5 266 l2.5 2.5 l5 -6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="394" y="270" class="small">Remediation governance</text>
  </g>

  <path d="M536 224 H582" class="flow" marker-end="url(#arrow)"/>

  <rect x="588" y="190" width="136" height="70" rx="10" fill="#f6f9fa" stroke="#cad7df" stroke-width="1.5"/>
  <circle cx="614" cy="225" r="9" fill="#2f7f95"/><path d="M609 225 l3.5 3.5 l6.5 -7.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="656" y="221" text-anchor="middle" class="step">Revenue</text>
  <text x="656" y="239" text-anchor="middle" class="step">protected</text>

  <rect x="86" y="362" width="628" height="38" rx="8" fill="#f6f9fa" stroke="#dce6eb"/>
  <text x="400" y="385" text-anchor="middle" class="footer">Controls catch losses and liability before they accumulate.</text>
  <rect x="50" y="116" width="82" height="4" rx="2" fill="#2f7f95"/>
  <rect x="138" y="116" width="42" height="4" rx="2" fill="#c9922e"/>
</svg>
