<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Readiness And Control Discipline: Control gates and launch evidence.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/>
      <stop offset="1" stop-color="#edf3f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b6f8f"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:850;fill:#0f172a;letter-spacing:.2px}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#526272}
      .step{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#172234}
      .footer{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:750;fill:#344456}
      .flow{fill:none;stroke:#3b6f8f;stroke-width:2.2;stroke-linecap:round}
      .rail{fill:none;stroke:#d2dde3;stroke-width:2}
      .tick{stroke:#cad7df;stroke-width:1.5}
    </style>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="402" rx="12" fill="#fff" stroke="#d9e3e8"/>
  <text x="50" y="70" class="title">Readiness And Control Discipline</text>
  <text x="50" y="98" class="sub">Control gates and launch evidence</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#e4ebef"/>
  <path d="M92 322 H708" class="rail"/>
  <circle cx="180.0" cy="322" r="5" fill="#3b6f8f"/><line x1="180.0" y1="332" x2="180.0" y2="352" class="tick"/>
<circle cx="326.7" cy="322" r="5" fill="#c9922e"/><line x1="326.7" y1="332" x2="326.7" y2="352" class="tick"/>
<circle cx="473.3" cy="322" r="5" fill="#3b6f8f"/><line x1="473.3" y1="332" x2="473.3" y2="352" class="tick"/>
<circle cx="620.0" cy="322" r="5" fill="#c9922e"/><line x1="620.0" y1="332" x2="620.0" y2="352" class="tick"/>
  <path d="M255.5 218 H277.5" class="flow" marker-end="url(#arrow)"/>
  <path d="M397.5 218 H419.5" class="flow" marker-end="url(#arrow)"/>
  <path d="M534.5 218 H556.5" class="flow" marker-end="url(#arrow)"/>
      <g>
        <rect x="137.5" y="174" width="116" height="88" rx="8" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
        <circle cx="161.5" cy="201" r="8" fill="#3b6f8f"/>
        <path d="M157.5 201 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="195.5" y="232" text-anchor="middle" class="step">Controls</text>
      </g>
      <g>
        <rect x="279.5" y="174" width="116" height="88" rx="8" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
        <circle cx="303.5" cy="201" r="8" fill="#3b6f8f"/>
        <path d="M299.5 201 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="337.5" y="232" text-anchor="middle" class="step">Evidence</text>
      </g>
      <g>
        <rect x="421.5" y="174" width="111" height="88" rx="8" fill="#fff8e8" stroke="#c9922e" stroke-width="1.5"/>
        <circle cx="445.5" cy="201" r="8" fill="#c9922e"/>
        <path d="M441.5 201 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="477.0" y="232" text-anchor="middle" class="step">Signoff</text>
      </g>
      <g>
        <rect x="558.5" y="174" width="104" height="88" rx="8" fill="#ffffff" stroke="#cad7df" stroke-width="1.5"/>
        <circle cx="582.5" cy="201" r="8" fill="#3b6f8f"/>
        <path d="M578.5 201 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="610.5" y="232" text-anchor="middle" class="step">Value</text>
      </g>
  <rect x="86" y="360" width="628" height="40" rx="8" fill="#f6f9fa" stroke="#dce6eb"/>
  <text x="400" y="385" text-anchor="middle" class="footer">Launch confidence depends on evidence quality, not assertion.</text>
  <rect x="50" y="116" width="82" height="4" rx="2" fill="#3b6f8f"/>
  <rect x="138" y="116" width="42" height="4" rx="2" fill="#c9922e"/>
</svg>



